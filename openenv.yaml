name: stratos-rl
version: "1.0.0"
description: >
  SaaS CEO Simulator. Agent manages capital allocation, marketing,
  infrastructure, and hiring to reach $10k MRR. Grounded in economic
  simulations of churn, price elasticity, and debt dynamics.
tags:
  - openenv
  - finance
  - SaaS
  - simulation
  - optimization
tasks:
  - id: task-1-viral
    name: "The Viral Crash"
    difficulty: "easy"
    max_steps: 20
    reward_range: [0.0, 1.0]
  - id: task-2-enterprise
    name: "The Enterprise Pivot"
    difficulty: "medium"
    max_steps: 25
    reward_range: [0.0, 1.0]
  - id: task-3-price
    name: "The Efficiency War"
    difficulty: "hard"
    max_steps: 30
    reward_range: [0.0, 1.0]
observation_space: stratos_gym.models.StratosObservation
action_space: stratos_gym.models.StratosAction
reward_model: stratos_gym.models.StratosReward
