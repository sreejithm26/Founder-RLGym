[project]
name = "founder-gym"
version = "0.1.0"
description = "SaaS CEO Simulator for OpenEnv"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.0",
    "numpy>=1.26.0",
    "openai>=1.30.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[tool.setuptools]
packages = ["founder_gym"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
